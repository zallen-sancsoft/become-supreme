<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            background: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            /* Crucial for mobile performance */
            touch-action: none;
            -webkit-touch-callout: none; /* Disables the long-press popup menu */
            user-select: none; /* Prevents text highlighting while tapping */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeGame() {
            // 1. Choose your target aspect ratio (e.g., 9:16 for portrait mobile)
            const targetRatio = 9 / 16;

            // 2. Measure the available window space
            let windowW = window.innerWidth;
            let windowH = window.innerHeight;

            // 3. Calculate best fit matching the ratio
            if (windowW / windowH > targetRatio) {
                canvas.height = windowH;
                canvas.width = windowH * targetRatio;
            } else {
                canvas.width = windowW;
                canvas.height = windowW / targetRatio;
            }

            // 4. Update your game engine center-points dynamically
            HALF_W = canvas.width / 2;
            HALF_H = canvas.height / 2;
            PROJECTION_DIST = canvas.width * 0.8; // Scales focal length to match screen width
        }

        // Initialize variables dynamically instead of with 'const'
        let HALF_W, HALF_H, PROJECTION_DIST;

        // Run on startup and whenever the device rotates
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // Player state
        let playerX = 0;
        let playerSpeed = 8;
        let keys = {};

        // Add this to your player state variables
        let playerRadius = 100; // Size of the player circle in pixels

        let isGameOver = false;
        let score = 0;

        // Cubes state
        let cubes = [];

        const NUM_CUBES = 2000;
        const MAP_WIDTH = 40000; // Horizontal span of the field
        const MAX_DEPTH = 3000;
        const START_SAFE_ZONE = 1000;

        // Initialize random cubes
        for (let i = 0; i < NUM_CUBES; i++) {
            cubes.push({
                x: (Math.random() - 0.5) * MAP_WIDTH,
                y: 100,
                // Old way: z: Math.random() * MAX_DEPTH
                // New way: Generates depth between 400 and 1200
                z: START_SAFE_ZONE + (Math.random() * (MAX_DEPTH - START_SAFE_ZONE)),
                size: 40,
                color: `hsl(${Math.random() * 40 + 20}, 100%, 50%)`
            });
        }

        // Input listeners
        // Modify your existing keys object to handle inputs uniformly
        let controls = {
            left: false,
            right: false
        };

        // --- Desktop Keyboard Controls ---
        window.addEventListener('keydown', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') controls.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') controls.right = true;
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') controls.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') controls.right = false;
        });

        // --- Mobile Touch Controls ---
        function handleTouch(e) {
            // Prevent default browser behaviors like zooming or scrolling
            e.preventDefault();

            // Reset control states before checking active touches
            controls.left = false;
            controls.right = false;

            // Loop through all active fingers on the screen
            for (let i = 0; i < e.touches.length; i++) {
                let touchX = e.touches[i].clientX;
                let screenWidth = window.innerWidth;

                // If touch is on the left half of the window
                if (touchX < screenWidth / 2) {
                    controls.left = true;
                }
                // If touch is on the right half of the window
                else {
                    controls.right = true;
                }
            }
        }

        // Attach touch events directly to the window or canvas
        window.addEventListener('touchstart', handleTouch, { passive: false });
        window.addEventListener('touchmove', handleTouch, { passive: false });
        window.addEventListener('touchend', handleTouch, { passive: false });
        window.addEventListener('keydown', e => { if (e.code === 'Space') resetGame(); });
        window.addEventListener('touchstart', resetGame);


        function update() {
            // Stop updating if the game is over
            if (isGameOver) return;

            // Player steering
            if (controls.left) playerX -= playerSpeed;
            if (controls.right) playerX += playerSpeed;

            // Increment score over time
            score += 1;

            // Update cube positions and check for collisions
            for (let cube of cubes) {
                cube.z -= 6; // Move towards camera

                // --- COLLISION DETECTION MATH ---
                // 1. Check if the cube has reached the player's Z-depth plane (Z close to 0)
                // We use a small threshold buffer (e.g., between Z=0 and Z=30)
                if (cube.z > 0 && cube.z < 10) {

                    // 2. Calculate the center distance between the player and the cube on the X-axis
                    let distanceX = Math.abs(cube.x - playerX);

                    // 3. Define the collision boundary width
                    // This combines the cube's physical width and the player's safety margin
                    let collisionBuffer = cube.size / 2 + 15;

                    // 4. Trigger game over if the player is inside the horizontal boundaries
                    if (distanceX < collisionBuffer) {
                        isGameOver = true;
                    }
                }

                // Respawn if passed camera
                if (cube.z <= 0) {
                    cube.z = MAX_DEPTH;
                    cube.x = playerX + (Math.random() - 0.5) * MAP_WIDTH;
                }
            }

            // Sort back-to-front
            cubes.sort((a, b) => b.z - a.z);
        }


        function draw() {
            // Clear screen & Draw Sky
            ctx.fillStyle = '#e0f6ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Ground
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(0, HALF_H, canvas.width, HALF_H);

            // Draw Horizon Line
            ctx.strokeStyle = '#999';
            ctx.beginPath(); ctx.moveTo(0, HALF_H); ctx.lineTo(canvas.width, HALF_H); ctx.stroke();

            // Render Cubes
            for (let cube of cubes) {
                // Translate world X relative to player camera
                let relativeX = cube.x - playerX;

                // Perspective scale factor
                let scale = PROJECTION_DIST / cube.z;

                // Project to 2D screen positions
                let screenX = HALF_W + (relativeX * scale);
                let screenY = HALF_H + (cube.y * scale);
                let screenSize = cube.size * scale;

                // Only draw if it's on screen
                if (screenX + screenSize > 0 && screenX - screenSize < canvas.width) {
                    ctx.fillStyle = cube.color;
                    // Draw pseudo-3D front face
                    ctx.fillRect(screenX - screenSize / 2, screenY - screenSize, screenSize, screenSize);

                    // Draw simple black outline for depth clarity
                    ctx.strokeStyle = '#000';
                    ctx.strokeRect(screenX - screenSize / 2, screenY - screenSize, screenSize, screenSize);
                }
            }

            // --- DRAW PLAYER CIRCLE ---
            // Position it at the horizontal center, slightly up from the bottom edge
            let px = canvas.width / 2;
            let py = canvas.height - 120;

            ctx.beginPath();
            // Creates a perfect circle path: arc(x, y, radius, startAngle, endAngle)
            ctx.arc(px, py, playerRadius, 0, 2 * Math.PI);

            // Style the player circle (e.g., sleek charcoal gray or bright electric blue)
            ctx.fillStyle = '#333333';
            ctx.fill();

            // Add a clean outline so it stands out against gray ground or dark cubes
            ctx.strokeStyle = '#ffffff';
            //ctx.lineWidth = 3;
            ctx.stroke();
            ctx.closePath();

            if (isGameOver) {
                // Semi-transparent dark background overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Game Over Text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

                // Restart Instructions Text
                ctx.font = '20px sans-serif';
                ctx.fillStyle = '#aaaaaa';
                ctx.fillText('Tap Screen or Press Space to Restart', canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function resetGame() {
            if (!isGameOver) return;

            playerX = 0;
            score = 0;
            isGameOver = false;

            // Apply the safe zone padding on reset
            for (let cube of cubes) {
                cube.z = START_SAFE_ZONE + (Math.random() * (MAX_DEPTH - START_SAFE_ZONE));
                cube.x = (Math.random() - 0.5) * MAP_WIDTH;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        

        loop();
    </script>
</body>
</html>
